game_name: "Blackjack-v1"
max_episode_steps: 100

t_max: 30000

env_wrappers: []

alg_args:
  dqn:
    wrapper: ["state_to_one_hot"]
    gamma: 1.0
    lr: 0.0005
    epsilon_anneal_time: 10000
    sample_step_num: 64
    max_buffer_steps: 10000
    learning_starts: 1000
    target_update_interval: 500
    hidden_size: 128
  reinforce:
    wrapper: ["state_to_one_hot"]
    gamma: 1.0
    baseline: false
    formula: 1
    sample_episode_num: 32
    max_buffer_episodes: 32
    lr: 0.001
    hidden_size: 64
    t_max: 30000
