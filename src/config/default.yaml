# --- Logging options ---
use_tensorboard: True
save_model: False # Save the models to disk
local_results_path: "results"
log_interval: 20

# --- RL hyperparameters ---
gamma: 0.99
lr: 0.001
batch_size: 4
buffer_size: 4

# Historical decision-making process
cat_history_state: 1
cat_history_action: 0

#
input_dim: null

# device control
device: "cuda"
# dtype control
dtype: "float32"

name: "rl_learn"