game_name: "FrozenLake-v1"
max_episode_steps: 100

env_wrappers: []

alg_args:
  dqn:
    wrapper: ["state_to_one_hot"]
    lr: 0.001
    epsilon_anneal_time: 30000
    sample_step_num: 64
    max_buffer_steps: 5000
    learning_starts: 500
    target_update_interval: 200
    hidden_size: 64
    t_max: 100000
  reinforce:
    wrapper: ["state_to_one_hot"]
    sample_episode_num: 32
    max_buffer_episodes: 32
    lr: 0.001
    critic_lr: 0.001
    hidden_size: 64
    t_max: 150000
  q_learning:
    gamma: 0.99
    lr: 0.2
    epsilon_finish: 0.05
    epsilon_anneal_time: 50000
    t_max: 120000
  sarsa:
    gamma: 0.99
    lr: 0.2
    epsilon_finish: 0.05
    epsilon_anneal_time: 50000
    t_max: 120000
