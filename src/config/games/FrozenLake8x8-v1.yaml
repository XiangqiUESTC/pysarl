game_name: "FrozenLake8x8-v1"
max_episode_steps: 200

env_wrappers: []

alg_args:
  dqn:
    wrapper: ["state_to_one_hot"]
    lr: 0.0005
    epsilon_anneal_time: 80000
    sample_step_num: 64
    max_buffer_steps: 10000
    learning_starts: 1000
    target_update_interval: 200
    hidden_size: 128
    t_max: 200000
  reinforce:
    wrapper: ["state_to_one_hot"]
    sample_episode_num: 32
    max_buffer_episodes: 32
    lr: 0.001
    critic_lr: 0.001
    hidden_size: 128
    t_max: 200000
  q_learning:
    gamma: 1.0
    lr: 0.1
    q_init_val: 1.0
    epsilon_finish: 0.01
    epsilon_anneal_time: 500000
    t_max: 1000000
  sarsa:
    gamma: 0.99
    lr: 0.2
    epsilon_finish: 0.05
    epsilon_anneal_time: 100000
    t_max: 250000
